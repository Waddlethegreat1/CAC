test:
    metadata:
        name: talent-interest-chat
        platform: ios
        tags:
            - connections
    build:
        name: Scout iOS
    blocks:
        - type: module_import
          module: "onboard-student"
        - type: manual
          step_type: navigate
          step_description: "cac-scout://dev/seed-talent-match"
        - type: validation
          step_description: The ended event "[TEST] Scout fixture demo day" opens with no I'm going button. A Connect with the hosts section lists Scout Test Co with a Verified badge and an "Interested in Scout Test Co" button.
        - type: instructions
          step_description: Tap "Interested in Scout Test Co".
        - type: validation
          step_description: A sheet titled "Interested in Scout Test Co" explains that they will see your name and that you went, and that contact details stay private unless you share them after connecting. It has an optional message box with a 0/500 counter and a "Send interest" button.
        - type: instructions
          step_description: Type "Loved the demo day" in the message box and tap "Send interest".
        - type: validation
          step_description: The sheet closes and the Scout Test Co row says "Interest sent. Waiting for a reply".
        - type: instructions
          step_description: Open the Inbox tab and tap Outgoing.
        - type: validation
          step_description: Outgoing lists Scout Test Co with the quoted message "Loved the demo day", a Withdraw button, and a "Share my contact details" switch that is off.
