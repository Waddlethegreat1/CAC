test:
    metadata:
        name: profile-edit
        platform: ios
        tags:
            - e2e
            - student
    build:
        name: Scout iOS
    blocks:
        - type: module_import
          module: onboard-student
        - type: instructions
          step_description: Tap the Profile tab in the bottom tab bar.
        - type: validation
          step_description: A Profile screen shows "I am" with Student selected, an Interests section, and a Location section with Area set to "Palo Alto" and a Distance choice.
        - type: instructions
          step_description: Tap the "Edit interests" button, tap the "Climate" interest chip, then tap "Save interests".
        - type: validation
          step_description: A confirmation reads "Interests saved", and the interests list now includes Climate.
        - type: instructions
          step_description: Tap the Area row, then tap the "San Francisco" area chip.
        - type: validation
          step_description: A confirmation reads "Area set to San Francisco", and the Area row shows "San Francisco".
        - type: instructions
          step_description: Under Distance, tap "10 mi".
        - type: validation
          step_description: A confirmation reads "Distance updated", and "10 mi" is selected.
        - type: instructions
          step_description: Tap the Feed tab in the bottom tab bar.
        - type: validation
          step_description: The feed's location pill reads "San Francisco · 10 mi".
